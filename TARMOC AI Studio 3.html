<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TARMOC AI Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/app.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo"><img src="https://z-cdn-media.chatglm.cn/files/50b1b945-6331-4359-8843-2f9e85ba2565.png?auth_key=1883962976-b26aa67e6851416f9d61e71085cb2e0d-0-06620aea71ad2414381b827a258e5835" alt="TARMOC" class="sidebar-logo-img"><div class="sidebar-logo-text"><span class="brand">TARMOC</span><span class="sub">AI Studio</span></div></div></div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-workspace" id="sidebarWorkspace"></div>
    </aside>
    <div class="main-area">
      <header class="header" id="appHeader">
        <button class="header-hamburger" id="hamburgerBtn" aria-label="Toggle sidebar"><i data-lucide="menu"></i></button>
        <div class="header-search"><span class="search-icon"><i data-lucide="search"></i></span><input type="text" placeholder="Search projects, prompts, history..." id="globalSearch"></div>
        <div class="header-actions">
          <button class="header-btn" id="themeToggleBtn" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
          <div style="position:relative"><button class="header-btn" id="notifBtn" aria-label="Notifications"><i data-lucide="bell"></i><span class="badge" id="notifBadge">3</span></button><div class="notification-dropdown" id="notifDropdown"></div></div>
          <div class="header-credits" id="creditsBtn"><i data-lucide="zap"></i><span id="creditsCount">2,450</span></div>
          <div class="header-avatar" id="avatarBtn">JD</div>
        </div>
      </header>
      <main class="main-content" id="mainContent"></main>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <div id="modalContainer"></div>
 
  <script src="script/app.js"></script>
</body>
</html>
