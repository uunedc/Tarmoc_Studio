<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TARMOC Studio — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@200;400;600;800;900&family=Nunito:wght@800;900&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style/login.css">
  <style>
    .brand h1{background:none;-webkit-background-clip:unset;background-clip:unset;-webkit-text-fill-color:unset;letter-spacing:0}
    .brand-wordmark{display:flex;flex-direction:column;align-items:center;gap:6px}
    .brand-tarmoc{display:block;font-family:'Nunito','Outfit',sans-serif;font-weight:900;font-size:34px;letter-spacing:-0.02em;text-transform:uppercase;color:#FFC800;-webkit-text-stroke:2px #111827;paint-order:stroke fill;text-shadow:0 2px 1px rgba(0,0,0,0.18);line-height:1}
    .brand-studio-line{display:block;font-family:'Inter','Space Grotesk',sans-serif;font-weight:500;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#F0ECE4;line-height:1}
    .brand-studio-line .sub-deco{opacity:0.55;font-weight:400;letter-spacing:0;font-size:0.88em}
    .footer-note .brand-tarmoc{color:#FFC800;font-weight:800;-webkit-text-stroke:0.5px #111827;paint-order:stroke fill;text-shadow:0 1px 1px rgba(0,0,0,0.15)}
    .footer-note .brand-studio{color:#F0ECE4;font-weight:500;letter-spacing:0.12em}
    .dashboard-overlay .brand-tarmoc{color:#FFC800;font-weight:900;-webkit-text-stroke:1px #111827;paint-order:stroke fill;text-shadow:0 2px 1px rgba(0,0,0,0.18)}
    .dashboard-overlay .brand-studio{color:#F0ECE4;font-weight:500;letter-spacing:0.14em}
    .brand-studio .sub-deco,.dashboard-overlay .sub-deco{opacity:0.55;font-weight:400;letter-spacing:0;font-size:0.88em}
    @media(max-width:480px){
      .brand-tarmoc{font-size:28px;-webkit-text-stroke:1.5px #111827}
      .brand-studio-line{font-size:10px;letter-spacing:0.14em}
    }
  </style>
</head>
<body>

  <!-- Ambient blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Grid overlay -->
  <div class="grid-overlay"></div>

  <!-- Particle canvas -->
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main login wrapper -->
  <main class="login-wrapper">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <img src="https://z-cdn-media.chatglm.cn/files/66a39a56-20a9-4a3a-b3c5-8d8178f2c276.png?auth_key=1884002952-82ce8c5d78e84144a8bf2c41fd282d33-0-e2dc834912a8dddcfeb8783ef8a30c82" alt="TARMOC Studio Logo">
      </div>
      <h1 class="brand-wordmark">
        <span class="brand-tarmoc">TARMOC</span>
        <span class="brand-studio-line"><span class="sub-deco" aria-hidden="true">~</span> STUDIO <span class="sub-deco" aria-hidden="true">~</span></span>
      </h1>
      <p>Creative Workspace</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <h2>Selamat Datang</h2>
      <p class="subtitle">Masuk ke akun studio kamu</p>

      <form id="loginForm" novalidate autocomplete="off">
        <!-- Username -->
        <div class="field" id="fieldUser">
          <label for="username">Username</label>
          <div class="input-wrap">
            <i class="fa-regular fa-user"></i>
            <input
              type="text"
              id="username"
              placeholder="Masukkan username"
              spellcheck="false"
              aria-label="Username"
            >
          </div>
          <div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> <span>Username salah</span></div>
        </div>

        <!-- Password -->
        <div class="field" id="fieldPass">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              aria-label="Password"
            >
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> <span>Password salah</span></div>
        </div>

        <!-- Remember & Forgot -->
        <div class="remember-row">
          <label>
            <input type="checkbox" id="rememberMe">
            <span class="custom-check"><i class="fa-solid fa-check"></i></span>
            Ingat saya
          </label>
          <a href="#" class="forgot-link" onclick="showToast('Fitur segera hadir', 'error'); return false;">Lupa password?</a>
        </div>

        <!-- Button -->
        <button type="submit" class="btn-login" id="btnLogin">
          <span class="btn-text">MASUK</span>
          <span class="btn-loader"><span class="spinner"></span> Memverifikasi...</span>
        </button>
      </form>
    </div>

    <p class="footer-note">&copy; 2025 <span class="brand-tarmoc">TARMOC</span> <span class="brand-studio">Studio</span>. All rights reserved.</p>
  </main>

  <!-- Dashboard (setelah login berhasil) -->
  <div class="dashboard-overlay" id="dashboardOverlay">
    <div class="dash-logo">
      <img src="https://z-cdn-media.chatglm.cn/files/66a39a56-20a9-4a3a-b3c5-8d8178f2c276.png?auth_key=1884002952-82ce8c5d78e84144a8bf2c41fd282d33-0-e2dc834912a8dddcfeb8783ef8a30c82" alt="TARMOC Studio Logo">
    </div>
    <h2>Login Berhasil</h2>
    <p>Selamat datang di <span class="brand-tarmoc">TARMOC</span> <span class="brand-studio"><span class="sub-deco" aria-hidden="true">~</span> STUDIO <span class="sub-deco" aria-hidden="true">~</span></span></p>
    <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i>&nbsp; Keluar</button>
  </div>

  <script src="script/login.js"></script>
</body>
</html>
